services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mathion
      POSTGRES_PASSWORD: mathion
      POSTGRES_DB: mathion
    ports:
      - "5432:5432"
    volumes:
      - mathion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mathion -d mathion"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mathion_pgdata:
