name: CLI release

on:
  push:
    tags: ["cli-v*"]
  pull_request:
    paths:
      - "cli/**"
      - "deploy/install.sh"
      - "deploy/install_sh_test.sh"
      - ".github/workflows/release-cli.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "1.24" }
      - name: Unit
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: Integration harness — static validation (real-Docker legs are manual/opt-in)
        working-directory: cli
        run: |
          bash -n integration_test.sh
          shellcheck integration_test.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          install-only: true
      - name: install.sh shell test
        run: sh deploy/install_sh_test.sh

  release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "1.24" }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          install-only: true
      # Fail the release BEFORE importing any signing secret if install.sh's embedded
      # key / pins are not self-consistent with the shipped keyring (go-live guard).
      - name: Embedded-key authenticity guard (go-live pins)
        env:
          S_REL_FPR: ${{ vars.S_REL_FPR }}   # assert install.sh's pin == the release signer
        run: sh cli/scripts/release-embedded-key-guard.sh
      # Same guards as main CI, so they gate publication too.
      - name: self-update release guards
        env:
          S_REL_FPR: ${{ vars.S_REL_FPR }}
          S_REL_EMBEDDED_FPR: ${{ vars.S_REL_EMBEDDED_FPR }}
        run: sh cli/scripts/selfupdate-ci-guards.sh
      - name: Import S_rel + enable loopback
        env:
          S_REL: ${{ secrets.GPG_S_REL_PRIVATE }}
        run: |
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          printf '%s' "$S_REL" | gpg --batch --import
          # only the S_rel subkey may carry secret material; any other secret subkey fails closed.
          secsubs="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="ssb"{s=1;next} s&&$1=="fpr"{print $10;s=0}')"
          { [ "$(printf '%s\n' "$secsubs" | grep -c .)" = 1 ] && printf '%s\n' "$secsubs" | grep -qx "${{ vars.S_REL_FPR }}"; } \
            || { echo "GPG_S_REL_PRIVATE must contain exactly the S_rel signing subkey secret (see prereq 1 export)"; exit 1; }
          # also assert the PRIMARY secret is an offline stub: the `sec` record's field 15 is
          # '#' (GnuPG protect-mode 1001 = "simple stub", secret material NOT present). A full
          # --export-secret-keys would ship a USABLE primary alongside the correct subkey and
          # yield field 15 '+'; refuse it so CI can never wield the primary (spec §11.1).
          secprim="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="sec"{print $15}')"
          { [ "$(printf '%s\n' "$secprim" | grep -c .)" = 1 ] && [ "$secprim" = "#" ]; } \
            || { echo "GPG_S_REL_PRIVATE must be an --export-secret-subkeys export (offline/stub primary), never a full secret key"; exit 1; }
      - name: Build + sign (goreleaser)
        working-directory: cli
        env:
          CLI_TAG: ${{ github.ref_name }}
          APP_IMAGE: v0.2.0
          GPG_FINGERPRINT: ${{ vars.S_REL_FPR }}!
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$CLI_TAG" | grep -Eq '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "refusing to release a non cli-vX.Y.Z tag: $CLI_TAG" >&2; exit 1; }
          SEMVER="v${CLI_TAG#cli-v}"                 # cli-v0.2.0 -> v0.2.0
          # skip=validate: goreleaser's git-state check looks up a tag literally named
          # "$SEMVER" on HEAD, which collides with the app's own v* tag. We pass
          # GORELEASER_CURRENT_TAG explicitly.
          GORELEASER_CURRENT_TAG="$SEMVER" goreleaser release --clean --skip=publish,validate
      - name: Publish release
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/checksums.txt dist/checksums.txt.asc --title "$TAG" --notes "Mathion CLI $TAG"
