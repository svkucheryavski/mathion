name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: mathion
          POSTGRES_PASSWORD: mathion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathion"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MATHION_TEST_DATABASE_URL: postgresql+psycopg://mathion:mathion@localhost:5432/mathion_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install backend + dev deps
        run: pip install './backend[dev]'
      - name: Run backend suite
        run: cd backend && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install
        run: cd frontend && npm ci
      - name: Test (TZ pinned by the npm script)
        run: cd frontend && npm test
      - name: Build
        run: cd frontend && npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stack smoke (builds the prod image, boots the stack, asserts)
        run: bash deploy/smoke.sh

  cli-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - name: Vet + unit tests
        working-directory: cli
        run: |
          go vet ./...
          go test ./...

  apt-scripts:
    # Non-root coverage for the signing + packaging + anti-laundering resign
    # scripts (resign.sh/verify-inrelease.sh's only automated coverage). Kept a
    # separate job from the root-requiring apt-e2e for clean failure attribution.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          install-only: true
      - name: Shellcheck apt/deb + cli scripts
        run: shellcheck deploy/apt/*.sh deploy/deb/*.sh cli/scripts/*.sh cli/*.sh
      # gpg (preinstalled) + goreleaser/go (above) are all these need; resign_test
      # is gpg-only and deb_test inspects with dpkg-deb (preinstalled), so no
      # apt-utils/apt-ftparchive and no root are required here.
      - name: Signing + package + dates-only resign tests (throwaway keys)
        run: |
          sh deploy/deb/sign_test.sh
          sh deploy/deb/deb_test.sh
          sh deploy/apt/resign_test.sh
      - name: self-update release guards
        run: sh cli/scripts/selfupdate-ci-guards.sh
        env:
          # Wired now, empty until keygen -> the fpr pin (guard 3) skips. At rotation time
          # the maintainer sets these repo vars (S_REL_EMBEDDED_FPR only during a crossing).
          S_REL_FPR: ${{ vars.S_REL_FPR }}
          S_REL_EMBEDDED_FPR: ${{ vars.S_REL_EMBEDDED_FPR }}

  apt-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          install-only: true
      - name: Install apt-utils
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Hermetic apt e2e (throwaway key)
        # secure_path in ubuntu-latest sudoers would drop the setup-go/goreleaser
        # tool-cache dirs; forward the runner PATH so root can find go/goreleaser.
        run: sudo -E env "PATH=$PATH" sh deploy/apt/e2e_test.sh
