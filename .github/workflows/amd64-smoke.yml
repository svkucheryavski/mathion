name: amd64 smoke

# Manual, on-demand amd64 install validation.
#
# GitHub's ubuntu-latest runners are native x86-64 with Docker + compose v2, curl,
# and jq preinstalled, so this exercises the REAL amd64 CLI binary (installed via
# the shipped, checksum-verified release archive) and the amd64 app image
# end-to-end — install -> assert running image is amd64 -> /health -> /version ->
# superuser row -> uninstall --purge — without any cloud box.
#
# It is the amd64 real-install lane: release-cli.yml's CI only STATIC-validates the
# root-required manual integration harness (bash -n + shellcheck), so no gating job
# performs a real Docker install. Trigger this from the Actions tab when validating
# a release on amd64.
#
# Note: the runner default shell is `bash --noprofile --norc -eo pipefail`, so -e
# and pipefail are already on; the explicit `set -euo pipefail` adds -u and documents intent.
on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "CLI release tag to install (e.g. cli-v0.2.0); empty = latest cli-v*"
        required: false
        default: ""
      app_version:
        description: "App image tag to deploy and assert on /version"
        required: false
        default: "v0.2.0"

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_REPO: ghcr.io/svkucheryavski/mathion
    steps:
      - uses: actions/checkout@v7

      - name: Install the mathion CLI (real amd64 archive, checksum-verified)
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64" || { echo "FAIL: runner is not x86_64 ($(uname -m))"; exit 1; }
          sudo sh deploy/install.sh "${CLI_VERSION}"
          # Drain the full output once (no pipe into head: `mathion version | head -1`
          # can SIGPIPE the CLI under pipefail and spuriously fail), then slice line 1.
          vout="$(mathion version)"
          printf '%s\n' "${vout}"
          first="${vout%%$'\n'*}"
          if [ -n "${CLI_VERSION}" ]; then
            # A specific tag was requested: the baked build version must match it exactly
            # (guards against a release archive carrying a mis-tagged binary).
            test "${first}" = "mathion ${CLI_VERSION}" \
              || { echo "FAIL: CLI version is '${first}', want 'mathion ${CLI_VERSION}'"; exit 1; }
          else
            # latest cli-v* resolved by the installer: require a release build, not 'dev'.
            case "${first}" in
              "mathion cli-v"*) : ;;
              *) echo "FAIL: CLI is not a release build (got: '${first}')"; exit 1 ;;
            esac
          fi

      - name: Deploy app + assert amd64 running image, health, /version, superuser
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          sudo mathion install --version "${APP_VERSION}" --domain localhost:8000 --admin-email ci@example.edu --yes

          # Assert the RUNNING app container (not just a locally-tagged image) is the
          # requested amd64 image. Inspect the container's image ID, then its arch.
          run_tag="$(sudo docker inspect --format '{{.Config.Image}}' mathion_prod-app-1)"
          test "${run_tag}" = "${IMAGE_REPO}:${APP_VERSION}" \
            || { echo "FAIL: running app image is '${run_tag}', want '${IMAGE_REPO}:${APP_VERSION}'"; exit 1; }
          img_id="$(sudo docker inspect --format '{{.Image}}' mathion_prod-app-1)"
          arch="$(sudo docker image inspect "${img_id}" --format '{{.Architecture}}')"
          echo "running app image: ${run_tag} (${img_id}) arch=${arch}"
          test "${arch}" = "amd64" || { echo "FAIL: running app image arch is '${arch}', want amd64"; exit 1; }

          # /health: parse JSON (a substring grep would false-pass on unrelated 200 bodies).
          # install returns only after compose reports healthy; retry briefly for CI robustness.
          # jq -se (slurp): require EXACTLY ONE top-level JSON object — bare `jq -e`
          # bases its status on the LAST value of a multi-document stream, so a
          # malformed `{"status":"bad"}\n{"status":"ok"}` body would false-pass.
          ok=""
          for _ in 1 2 3 4 5; do
            if curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:8000/health \
                 | jq -se 'length == 1 and (.[0] | type == "object" and .status == "ok")' >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test -n "${ok}" || { echo "FAIL: /health not ok"; exit 1; }
          echo "health: ok"

          ver="$(curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:8000/version)"
          echo "/version -> ${ver}"
          # slurp + length==1: reject a multi-document stream, a legacy 200 HTML SPA,
          # and a missing/wrong .version. (stderr left visible: jq's parse error is a
          # useful diagnostic on the single terminal check.)
          printf '%s' "${ver}" | jq -se --arg v "${APP_VERSION}" 'length == 1 and (.[0] | type == "object" and .version == $v)' >/dev/null \
            || { echo "FAIL: /version body is not a single {\"version\":\"${APP_VERSION}\"}"; exit 1; }
          echo "/version: ${APP_VERSION}"

          n="$(sudo docker exec mathion_prod-db-1 \
                psql -U mathion -d mathion -tAc "select count(*) from users where is_superuser" \
                | tr -d '[:space:]')"
          test "${n}" = "1" || { echo "FAIL: superuser count = ${n} (want 1)"; exit 1; }
          echo "superuser row: 1"

      - name: Uninstall --purge + assert full teardown
        run: |
          set -euo pipefail
          printf 'mathion_prod\n' | sudo mathion uninstall --purge

          # Assert absence via queries that MUST themselves succeed (a failing
          # `volume inspect` would otherwise read as "absent" and false-pass).
          # Filter on the EXACT compose project label, not a `name=` substring
          # (substring over-matches e.g. `backup_mathion_prod_..._copy` -> spurious FAIL);
          # compose stamps this label on all containers, the network, and named volumes.
          proj="label=com.docker.compose.project=mathion_prod"
          vols="$(sudo docker volume ls --filter "${proj}" --format '{{.Name}}')"
          test -z "${vols}" || { echo "FAIL: volumes survived purge: ${vols}"; exit 1; }
          cons="$(sudo docker ps -a --filter "${proj}" --format '{{.Names}}')"
          test -z "${cons}" || { echo "FAIL: containers survived purge: ${cons}"; exit 1; }
          nets="$(sudo docker network ls --filter "${proj}" --format '{{.Name}}')"
          test -z "${nets}" || { echo "FAIL: network survived purge: ${nets}"; exit 1; }
          echo "purge: volumes + containers + network gone (compose project label)"

      - name: Cleanup (always)
        if: always()
        run: |
          # Idempotent teardown so a mid-run failure never leaves the runner dirty.
          # The identity purge is config-independent and re-runnable.
          printf 'mathion_prod\n' | sudo mathion uninstall --purge || true
