version: 2

builds:
  - id: mathion
    main: ./
    binary: mathion
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Env.CLI_TAG }}
      - -X main.defaultImage={{ .Env.APP_IMAGE }}

archives:
  - id: mathion
    name_template: "mathion_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

release:
  disable: true   # goreleaser must NOT create the GitHub release; gh does (workflow)
