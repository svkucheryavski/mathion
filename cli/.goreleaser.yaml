version: 2

builds:
  - id: mathion
    main: ./
    binary: mathion
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Env.CLI_TAG }}
      - -X main.defaultImage={{ .Env.APP_IMAGE }}

archives:
  - id: mathion
    name_template: "mathion_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: ["none*"]   # non-matching glob -> binary-only. Empty [] would re-add README*/LICENSE*.

snapshot:
  # Local snapshot builds keep the plain version; the prod release runs without --snapshot.
  version_template: "{{ .Version }}"

checksum:
  name_template: "checksums.txt"

signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.asc"
    stdin: "{{ .Env.GPG_PASSPHRASE }}"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "--armor"
      - "--digest-algo"
      - "SHA256"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  disable: true   # goreleaser must NOT create the GitHub release; gh does (workflow)
